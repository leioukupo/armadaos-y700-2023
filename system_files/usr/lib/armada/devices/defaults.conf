ARMADA_DEVICE_ID=unknown
ARMADA_DEVICE_NAME=unknown
ARMADA_SOC_CLASS=

ARMADA_PRIMARY_CONNECTOR=DSI-1
# Backlight Steam brightness writes are steered to. Only needed on devices
# with more than one backlight (Steam grabs the first one it finds).
ARMADA_PRIMARY_BACKLIGHT=
# Set on dual-screen devices; the desktop session extends onto this output.
ARMADA_SECONDARY_CONNECTOR=
# Backlight for the secondary panel, when present.
ARMADA_SECONDARY_BACKLIGHT=
# 1 = armada-powerd drives the panel backlight from the connector's DPMS state
# instead of trusting the backlight driver's FB_BLANK handling. An internal panel
# keeps whatever frame it was last given, so a driver that ignores FB_BLANK
# leaves a powered-down display lit and it reads as a frozen screen.
ARMADA_BACKLIGHT_FOLLOWS_PANEL=0
# Seconds of no input before Steam dims the backlight. Steam's dim lands at ~3 %
# of the lamp range, which some panels cannot show. Empty keeps Steam's own
# default; 0 disables the idle dim on panels where it reads as a black screen.
ARMADA_STEAM_IDLE_DIM_SECONDS=
# Connector where Plasma's virtual keyboard should appear. Empty keeps KWin's
# upstream active-output behavior.
ARMADA_VIRTUAL_KEYBOARD_CONNECTOR=
# Input device names used to pin each touchscreen to its own output in the
# desktop session (only needed when a secondary connector is set).
ARMADA_PRIMARY_TOUCHSCREEN=
ARMADA_SECONDARY_TOUCHSCREEN=
# Desktop-only libinput calibration matrix for the primary touchscreen. It
# overrides the udev-provided calibration in the desktop session; empty leaves
# the device unchanged.
ARMADA_DESKTOP_TOUCHSCREEN_CALIBRATION=
ARMADA_PANEL_TYPE=internal
ARMADA_PANEL_ORIENTATION=normal
# Orientation gamescope must rotate the gaming session to. Empty means the
# launcher falls back to ARMADA_PANEL_ORIENTATION. Set this on devices whose
# desktop rotation comes from the compositor instead (the panel is scanned out
# portrait and KWin bakes the rotation in), where ARMADA_PANEL_ORIENTATION has
# to stay normal or the desktop would rotate twice.
ARMADA_GAMESCOPE_ORIENTATION=
ARMADA_GAMESCOPE_USE_ROTATION_SHADER=0
ARMADA_GAMESCOPE_FAKE_OUTPUT_MM=
# Seconds the gaming session waits for Gamescope to report its displays. The
# launcher default is fifteen; raise this on hardware where readiness is a fixed
# wait rather than cache work.
ARMADA_GAMESCOPE_STARTUP_TIMEOUT=
ARMADA_GAMEPAD_QUIRK=none
# 1 when the device has a built-in gamepad InputPlumber exposes as a
# CompositeDevice; set 0 on devices with none so `controller-type apply`
# returns a no-op instead of waiting for that device to appear.
ARMADA_BUILTIN_GAMEPAD=1
# Controller targets InputPlumber can emulate on this device, comma
# separated, in menu order. The first entry is the default. Explicit user
# choice in /etc/armada/controller.conf overrides this when present.
ARMADA_IP_TARGETS=deck-uhid,xbox-series,xb360,ds5
# Session sddm autologins into on each boot: gamemode (gamescope/Steam) or
# desktop (Plasma, for devices without a gamepad).  armada-session-default feeds it
# to session-control default-session.
ARMADA_DEFAULT_SESSION=gamemode
# s2idle or fake
ARMADA_SUSPEND_MODE=s2idle
ARMADA_HDR_NITS=0

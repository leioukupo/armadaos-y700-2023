ARMADA_DEVICE_ID=lenovo-tb320fc
ARMADA_DEVICE_NAME='Lenovo Legion Y700 Gen2'
ARMADA_SOC_CLASS=SM8475
# The Gen2 panel is a 1600x2560 portrait panel scanned out in landscape; use
# the same 270-degree gamescope rotation path as the Gen4 profile.
ARMADA_GAMESCOPE_USE_ROTATION_SHADER=1
# KWin rotates DSI-1 by 270 degrees on its own (kwinoutputconfig transform
# Rotated270), so the desktop is landscape with ARMADA_PANEL_ORIENTATION left
# at normal. gamescope does not follow that: it only rotates when it is handed
# --force-orientation, so Steam mode came up portrait on a landscape tablet.
ARMADA_GAMESCOPE_ORIENTATION=right
# Gamescope takes fifty seconds to report its displays on this tablet, and the wait
# is a property of the hardware (state S and a flat RSS the whole time, unchanged by
# which Vulkan ICDs are visible), so fifteen seconds only ever ended in
# "gamescope failed" and a desktop fallback.
ARMADA_GAMESCOPE_STARTUP_TIMEOUT=90
# novatek-nt36523n-spi registers the digitizer under this name, which is what
# /proc/bus/input/devices shows on the tablet; it is the only touchscreen there.
# The vendor NVT36xxx host-download driver used Android's NVT string instead, so
# name matching against it silently found nothing.
ARMADA_PRIMARY_TOUCHSCREEN='NT36523N Capacitive Touchscreen'
# TB320FC has no built-in gamepad; InputPlumber exposes sources but no
# CompositeDevice, so `controller-type apply` must not wait for one.
ARMADA_BUILTIN_GAMEPAD=0
# A tablet has no gamepad, so boot into the Plasma desktop instead of gamemode.
ARMADA_DEFAULT_SESSION=desktop
# The ktz8866 lamp keeps burning when the DSI panel is powered down: the driver
# only reacts to brightness writes, never to the panel's FB_BLANK, so a blanked
# tablet shows its last frame lit and looks frozen (PROGRESS.md A172).
ARMADA_BACKLIGHT_FOLLOWS_PANEL=1
# s2idle takes the ADSP, the Adreno GPU and ath11k down and none of them come back on
# this board (PROGRESS.md A147), so stay on ArmadaOS' fake suspend.
ARMADA_SUSPEND_MODE=fake

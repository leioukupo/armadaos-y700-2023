ARMADA_DEVICE_ID=lenovo-tb320fc
ARMADA_DEVICE_NAME='Lenovo Legion Y700 Gen2'
ARMADA_SOC_CLASS=SM8475
# The Gen2 panel is a 1600x2560 portrait panel scanned out in landscape; use
# the same 270-degree gamescope rotation path as the Gen4 profile.
ARMADA_GAMESCOPE_USE_ROTATION_SHADER=1
# The NVT36xxx host-download SPI driver registers this name in Android and in
# the imported mainline driver (0225).
ARMADA_PRIMARY_TOUCHSCREEN='NVTCapacitiveTouchScreen'
# TB320FC has no built-in gamepad; InputPlumber exposes sources but no
# CompositeDevice, so `controller-type apply` must not wait for one.
ARMADA_BUILTIN_GAMEPAD=0

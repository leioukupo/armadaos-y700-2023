# SPDX-License-Identifier: MIT
# ArmadaOS WirePlumber drop-in for the Lenovo Legion Y700 Gen 2 (TB320FC) speakers.
#
# Installed by device-quirks only for this board (ARMADA_DEVICE_ID=lenovo-tb320fc) to:
#     /etc/wireplumber/wireplumber.conf.d/91-armada-tb320fc-speakers.conf
# (WirePlumber 0.5+, SPA-JSON tables; same shape as 53-lenovo-tb710fu-speakers.conf.)
#
# Why: the speaker path is ADSP/AudioReach -> PRIMARY_MI2S_RX -> two CS35L45 running a
# Cirrus "Project Asphalt" protection image. WirePlumber suspends an idle sink after a
# few seconds (scripts/node/suspend-node.lua, default 5 s), which takes the q6apm graph
# and the amplifier ASP clock down, and the resume does not reliably bring it back. The
# stream then looks perfectly healthy while nothing comes out: pcm0p state RUNNING,
# LPASS_CLK_ID_PRI_MI2S_IBIT enabled at 1536000, CS35L45 BLOCK_ENABLES with AMP_EN set,
# CSPL mailbox status RUNNING, both amplifiers runtime-active. Measured on the board on
# 2026-11-24: after an idle suspend, two 20 s 500 Hz tones came out silent or nearly
# silent, and only re-arming the amplifiers (AMP Enable off/on, which is the DAPM switch
# whose PRE_PMD/POST_PMU events send CSPL PAUSE then RESUME) or restarting the ADSP and
# re-applying the route restored them. Every kcontrol read identically in the dead state
# and in the working one, the same "the meters lie" signature recorded in PROGRESS.md A184.
#
# Keeping the sink resident removes the trigger instead of chasing the symptom. The
# fragment this image already ships for the Lenovo TB710FU - same Asphalt family, same
# smart-amp stack - states the reason in one line: "each resume restarts the four
# amplifiers, and they occasionally fail to lock to the TDM clock".
#
# Scope: ALSA output nodes of this card only. The card already negotiates s16le 48 kHz
# through UCM, so no audio.format pin is needed here.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
        alsa.card_name = "Lenovo-Y700"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]

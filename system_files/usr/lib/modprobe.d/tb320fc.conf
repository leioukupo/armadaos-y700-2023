# TB320FC (Lenovo Y700 Gen2) AudioReach ordering.
#
# udev coldplug loads modules in whatever order the bus walks them, and the ADSP
# audio chain then defers its probe until initcalls are done - after which the
# core stops retrying, so snd-sc8280xp never binds (PROGRESS.md A132-A137).
# /usr/libexec/tb320fc/audio loads the same chain in dependency order once the
# ADSP is up, so autoloading has to stay off. blacklist only suppresses
# autoloading: the explicit modprobe in that script still works, and so do the
# dependency pulls it triggers.
blacklist snd-soc-sc8280xp
blacklist snd-soc-cs35l45-i2c
blacklist snd-soc-cs35l45
blacklist cs_dsp
blacklist snd-soc-wm-adsp
blacklist snd-soc-qcom-sdw
blacklist snd-soc-qcom-common
blacklist snd-q6dsp-common
blacklist q6core
blacklist snd-q6apm
blacklist q6apm-dai
blacklist q6apm-lpass-dais
blacklist q6prm
blacklist q6prm-clocks
blacklist qcom_q6v5_pas
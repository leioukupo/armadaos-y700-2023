# TB320FC Wi-Fi bring-up (/usr/libexec/tb320fc/wifi).
# regdom is the ISO country for "iw reg set"; empty keeps the regulatory.db
# (world) default.
load=on
regdom=CN
polls=30
# WCN6855 has no BD address in its BDF, so ath11k reports a fresh "permanent" MAC every
# boot and the router hands out a new lease each time. auto derives one from the SoC serial
# number and keeps the vendor prefix (00:03:7f:12:xx:xx); keep leaves the driver value alone;
# an explicit 00:11:22:33:44:55 pins that address instead.
mac=auto
# mac_nm also writes the same address into every Wi-Fi connection as
# 802-11-wireless.cloned-mac-address. NetworkManager defaults to
# cloned-mac-address=preserve and restores the driver's (random, per-boot) permanent
# address at activation, so without this the pin is undone seconds later.
mac_nm=on
# mac_bind=off removes 802-11-wireless.mac-address from every Wi-Fi connection. That property
# binds a profile to one device address, and this chip gets a new "permanent" address at every
# service-ready, so a bound profile stops matching after one reboot: NetworkManager then asks
# for the password and files another bound copy (20 of them on one board). The pin above already
# ties the connections to the interface, so match by SSID. Set mac_bind=on to keep bindings.
mac_bind=off

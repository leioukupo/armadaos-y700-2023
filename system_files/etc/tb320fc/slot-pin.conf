# TB320FC boot-slot pinning (/usr/libexec/tb320fc/slot-pin).
# pin=off stops the unit from touching the GPT at all.
pin=on
# Which slot carries the boot image this board should boot. The running kernel
# cannot report it (the payload cmdline has no androidboot.slot_suffix), so it is
# declared here; HA1WZJJ5 keeps the ArmadaOS kshimc in boot_a.
slot=a
# Comma separated partition pairs to write. boot is the pair XBL actually demotes;
# the other 26 pairs already sit at the vendor resting state on a healthy board.
pairs=boot
# Priority overrides. Empty keeps each pair's own current high/low value
# (7/2 for boot, 15/11 for the firmware partitions); both must be 0-15.
#
# Measured on HA1WZJJ5 (PROGRESS A207): for a payload slot the vendor resting
# priority is not enough. With boot_a back at 10 - what the empty defaults
# restored - and dont-boot-again on boot_b, ABL parked the board on the fastboot
# screen on the next reboot, twice, with misc verified all zero and the image sha
# matching bit for bit. With boot_a at 15 the same image booted, twice. XBL
# decrements on every attempt (15 -> 10 -> 7 measured), so this has to be written
# again each boot rather than set once.
prio=15
peer_prio=11
# on  = also set dont-boot-again on the other slot, which is where Android leaves
#       an inactive slot, and keeps ABL from ever falling back.
# off = leave the other slot clean. This board's kshimc hides every slot that
#       carries the bit, so "on" is what made the Android entry vanish from the
#       menu; the target still wins on priority alone.
peer_dont=off
# commit=off leaves the unit in dry-run: it logs what drifted without writing,
# which is how you watch the decay before deciding to repair it.
commit=on

# TB320FC speaker bring-up (/usr/libexec/tb320fc/audio).
# digvol is the raw value for the two "Digital PCM Volume" kcontrols: the
# topology boots them at 0, which is -102.25 dB (silence), and the control
# rejects text forms such as "-8dB", so it has to be an integer.
load=on
unmute=on
digvol=400
polls=40
# passes: how many times the amplifier route is written. The first lands when the
# card appears; the second, pass_gap seconds later, is what makes both CS35L45
# speak on this board (verified 2026-11-23: one pass leaves one speaker silent and
# every kcontrol reads identically either way).
passes=2
pass_gap=8
# TB320FC speaker bring-up (/usr/libexec/tb320fc/audio).
# digvol is the raw value for the two "Digital PCM Volume" kcontrols: the
# topology boots them at 0, which is -102.25 dB (silence), and the control
# rejects text forms such as "-8dB", so it has to be an integer.
load=on
unmute=on
digvol=400
polls=40
# TB320FC legacy-unit takeover (/usr/libexec/tb320fc/legacy-off).
# Units the A-series boot payload keeps re-arming in /etc, and which the image now owns
# through tb320fc-audio / tb320fc-power / tb320fc-wifi / tb320fc-touch.  Anything listed
# here is disabled and masked at every boot: two writers on the CS35L45 controls, two
# ath11k loaders, or two watchers doing unbind/bind on the same NVT SPI device are races,
# not redundancy.
LEGACY="y700-audio.service y700-power.service y700-wifi.service y700-touchd.service"

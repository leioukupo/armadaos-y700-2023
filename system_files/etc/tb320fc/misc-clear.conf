# TB320FC: drop the bootloader boot-request that a payload reboot leaves in `misc`.
#
# Why this exists (PROGRESS.md A207).  A reboot issued from ArmadaOS leaves the
# 1 MiB `misc` partition holding `-bootloader` at offset 8.  On the next power-on
# the board sits on the fastboot screen instead of loading whichever boot image the
# slot flags point at, and nothing inside a payload Linux ever clears it again -
# only `fastboot erase misc` or a full restore did.  Measured on HA1WZJJ5: misc was
# written back byte-identical to the value that follows `adb reboot bootloader`,
# while the slot attributes on their own still pointed at the ArmadaOS boot image.
#
# The unit runs as a shutdown hook, so the request that the payload's own reboot
# path leaves behind is gone before the bootloader reads it.  A request armed from
# outside ArmadaOS (`fastboot`, `adb reboot bootloader` from a host, EDL) never
# reaches this code path, so those flows keep working.
clear=on
# KiB of the request region to zero.  The command fields live at offsets 0x0000
# and 0x0008; the vendor record at 0x8000 sits past this region and is left alone.
region_kib=16

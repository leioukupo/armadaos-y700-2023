# TB320FC touch watchdog (/usr/libexec/tb320fc/touch-watch).
# revive=auto re-inits the Novatek controller after a DPMS wake; off leaves the
# watcher observing only. ladder lists the seconds after the wake for each
# attempt, and it stops at the first attempt that brings the input device back.
revive=auto
ladder="5 20 45"
sample=1
# touch-revive counts this many matching input nodes as success.
want_input=1